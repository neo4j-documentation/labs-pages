site:
  title: Neo4j Labs Docs
  url: /labs

content:
  sources:
  - url: https://github.com/neo4j-contrib/neo4j-apoc-procedures.git
    branches: ['4.1', '4.0']
    start_path: docs/asciidoc
  - url: https://github.com/mroiter-larus/neo4j-streams.git
    branches: ['antora_docs']
    start_path: doc/docs
  # Neo4j Agent Memory - external content source
  - url: https://github.com/neo4j-labs/agent-memory.git
    branches: main
    start_path: docs

ui:
  bundle:
    url: https://d12wh7zj8x3amw.cloudfront.net/build/ui-bundle-latest.zip
    # url: /Users/adam/projects/docs/ui/build/ui-bundle.zip
    snapshot: true
urls:
  html_extension_style: indexify

output:
  dir: ./build/site/labs/

asciidoc:
  extensions:
  - "@neo4j-documentation/remote-include"
  - "@neo4j-documentation/macros"
  attributes:
    page-theme: labs
